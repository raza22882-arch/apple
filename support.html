<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support</title>

    <link rel="icon" type="image/png" href="title.png">

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                sans-serif;

            background: #f5f5f7;
            color: #1d1d1f;

            overflow-x: hidden;
        }


        /* =========================================================
           NAVIGATION
        ========================================================= */

        .nav {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;

            height: 52px;

            background:
                rgba(245,245,247,.82);

            border-bottom:
                1px solid rgba(0,0,0,.08);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-inner {
            width: min(100%, 1100px);

            height: 100%;

            margin: auto;

            padding: 0 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .brand {
            display: flex;

            align-items: center;

            width: 30px;

            text-decoration: none;
        }

        .brand img {
            width: 18px;
            height: 22px;

            object-fit: contain;

            display: block;
        }


        /* =========================================================
           DESKTOP LINKS
        ========================================================= */

        .nav-links {
            display: flex;

            align-items: center;

            gap: 28px;
        }

        .nav-links a {
            color: #55555a;

            text-decoration: none;

            font-size: 12px;

            transition:
                color .2s ease;
        }

        .nav-links a:hover {
            color: #000;
        }


        /* =========================================================
           ACTIONS
        ========================================================= */

        .nav-actions {
            display: flex;

            align-items: center;

            gap: 4px;
        }

        .nav-button {
            width: 34px;
            height: 34px;

            border: 0;

            background: transparent;

            display: grid;

            place-items: center;

            cursor: pointer;

            border-radius: 50%;

            transition:
                background .2s ease;
        }

        .nav-button:hover {
            background:
                rgba(0,0,0,.06);
        }


        /* =========================================================
           SEARCH ICON
        ========================================================= */

        .search-icon {
            position: relative;

            width: 15px;
            height: 15px;

            border:
                1.5px solid #333;

            border-radius: 50%;
        }

        .search-icon::after {
            content: "";

            position: absolute;

            width: 6px;
            height: 1.5px;

            background: #333;

            right: -5px;
            bottom: -2px;

            transform: rotate(45deg);

            border-radius: 2px;
        }


        /* =========================================================
           MENU ICON
        ========================================================= */

        .menu-icon {
            position: relative;

            width: 17px;
            height: 12px;
        }

        .menu-icon::before,
        .menu-icon::after {
            content: "";

            position: absolute;

            left: 0;

            width: 17px;
            height: 1.5px;

            background: #333;

            border-radius: 2px;

            transition:
                transform .3s ease,
                top .3s ease;
        }

        .menu-icon::before {
            top: 2px;
        }

        .menu-icon::after {
            top: 9px;
        }

        .nav-button.active .menu-icon::before {
            top: 5px;

            transform: rotate(45deg);
        }

        .nav-button.active .menu-icon::after {
            top: 5px;

            transform: rotate(-45deg);
        }


        /* =========================================================
           MOBILE MENU
        ========================================================= */

        .mobile-menu {
            position: fixed;

            top: 52px;
            left: 0;
            right: 0;

            z-index: 950;

            background:
                rgba(250,250,252,.97);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border-bottom:
                1px solid rgba(0,0,0,.08);

            padding:
                10px 22px 22px;

            display: flex;

            flex-direction: column;

            opacity: 0;

            visibility: hidden;

            transform:
                translateY(-12px);

            pointer-events: none;

            transition:
                opacity .3s ease,
                transform .3s ease,
                visibility .3s ease;
        }

        .mobile-menu.open {
            opacity: 1;

            visibility: visible;

            transform:
                translateY(0);

            pointer-events: auto;
        }

        .mobile-menu a {
            padding: 15px 4px;

            font-size: 17px;

            color: #1d1d1f;

            text-decoration: none;

            border-bottom:
                1px solid rgba(0,0,0,.07);
        }

        .mobile-menu a:last-child {
            border-bottom: none;
        }


        /* =========================================================
           SEARCH PANEL
        ========================================================= */

        .search-panel {
            position: fixed;

            inset: 0;

            z-index: 1200;

            background:
                rgba(245,245,247,.92);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity .3s ease,
                visibility .3s ease;
        }

        .search-panel.open {
            opacity: 1;

            visibility: visible;
        }

        .search-container {
            width: min(100%, 700px);

            margin: auto;

            padding:
                70px 20px 30px;
        }

        .search-top {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .search-input {
            flex: 1;

            height: 52px;

            padding:
                0 17px;

            border:
                1px solid #d2d2d7;

            border-radius: 14px;

            outline: none;

            background: #fff;

            color: #1d1d1f;

            font-size: 16px;
        }

        .search-input:focus {
            border-color: #0071e3;

            box-shadow:
                0 0 0 3px
                rgba(0,113,227,.10);
        }

        .search-input::placeholder {
            color: #86868b;
        }

        .close-search {
            width: 42px;
            height: 42px;

            border: 0;

            border-radius: 50%;

            background:
                rgba(0,0,0,.06);

            color: #1d1d1f;

            font-size: 25px;

            cursor: pointer;
        }


        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            min-height: 100vh;

            padding-top: 52px;
        }


        /* =========================================================
           FORM HEADER
        ========================================================= */

        .form-header {
            text-align: center;

            padding:
                55px 20px 25px;
        }

        .form-header h1 {
            font-size:
                clamp(30px, 7vw, 48px);

            font-weight: 600;

            letter-spacing:
                -.035em;

            margin-bottom: 10px;
        }

        .form-header p {
            max-width: 600px;

            margin: auto;

            color: #6e6e73;

            font-size: 15px;

            line-height: 1.5;
        }


        /* =========================================================
           GOOGLE FORM CONTAINER
        ========================================================= */

        .form-wrapper {
            width: min(100%, 820px);

            margin:
                0 auto;

            padding:
                0 16px 50px;
        }

        .google-form {
            width: 100%;

            height: 1200px;

            display: block;

            border: none;

            border-radius: 18px;

            background: #fff;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,.08);
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 699px) {

            .nav-links {
                display: none;
            }

            #openMenu {
                display: grid;
            }

            .nav-inner {
                padding:
                    0 15px;
            }

            .form-header {
                padding:
                    40px 18px 20px;
            }

            .form-header h1 {
                font-size: 32px;
            }

            .form-header p {
                font-size: 14px;
            }

            .form-wrapper {
                padding:
                    0 8px 30px;
            }

            .google-form {
                height: 1350px;

                border-radius: 12px;

                box-shadow:
                    0 5px 25px
                    rgba(0,0,0,.06);
            }

        }


        /* =========================================================
           DESKTOP
        ========================================================= */

        @media (min-width: 700px) {

            #openMenu {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- =======================================================
         NAVIGATION
    ======================================================== -->

    <nav class="nav">

        <div class="nav-inner">


            <a
                href="index.html"
                class="brand"
            >

                <img
                    src="logo-1.png"
                    alt="Logo"
                >

            </a>


            <div class="nav-links">

                <a href="index.html">Store</a>

                <a href="laptop.html">Computers</a>

                <a href="tablet.html">Tablets</a>

                <a href="phone.html">Phones</a>

                <a href="#">Wearables</a>

                <a href="#">Audio</a>

                <a href="support.html">Support</a>

            </div>


            <div class="nav-actions">


                <button
                    class="nav-button"
                    id="openSearch"
                    type="button"
                    aria-label="Search"
                >

                    <span class="search-icon"></span>

                </button>


                <button
                    class="nav-button"
                    id="openMenu"
                    type="button"
                    aria-label="Menu"
                    aria-expanded="false"
                >

                    <span class="menu-icon"></span>

                </button>

            </div>

        </div>

    </nav>



    <!-- =======================================================
         MOBILE MENU
    ======================================================== -->

    <div
        class="mobile-menu"
        id="mobileMenu"
    >

        <a href="index.html">Store</a>

        <a href="laptop.html">Computers</a>

        <a href="tablet.html">Tablets</a>

        <a href="phone.html">Phones</a>

        <a href="#">Wearables</a>

        <a href="#">Audio</a>

        <a href="support.html">Support</a>

    </div>



    <!-- =======================================================
         SEARCH
    ======================================================== -->

    <div
        class="search-panel"
        id="searchPanel"
        aria-hidden="true"
    >

        <div class="search-container">

            <div class="search-top">

                <input
                    class="search-input"
                    id="siteSearch"
                    type="text"
                    placeholder="Search Support"
                    autocomplete="off"
                >

                <button
                    class="close-search"
                    id="closeSearch"
                    type="button"
                    aria-label="Close search"
                >

                    ×

                </button>

            </div>

        </div>

    </div>



    <!-- =======================================================
         PAGE
    ======================================================== -->

    <main class="page">


        <section class="form-header">
            <img src="logo-1.png" width="40px" height="50" alt="">
            <h1>
               Apple Support
            </h1>

            <p>
                Tell us how we can help. Complete the form below
                and submit your request.
            </p>

        </section>



        <!-- ===================================================
             GOOGLE FORM
        ==================================================== -->

        <div class="form-wrapper">

            <iframe
                class="google-form"
                src="https://docs.google.com/forms/d/e/1FAIpQLSereijmWcxhwZ0WNfDYQ3YncF5rBr3-iZh0xFUtpi8IhyLSXg/viewform?embedded=true"
                title="Support Form"
                loading="lazy"
                allowfullscreen
            >
                Loading…
            </iframe>

        </div>


    </main>



    <script>

        /* =====================================================
           MOBILE MENU
        ====================================================== */

        const openMenu =
            document.getElementById("openMenu");

        const mobileMenu =
            document.getElementById("mobileMenu");


        openMenu.addEventListener(
            "click",
            function () {

                const isOpen =
                    mobileMenu.classList.toggle("open");


                openMenu.classList.toggle(
                    "active",
                    isOpen
                );


                openMenu.setAttribute(
                    "aria-expanded",
                    isOpen
                );

            }
        );


        /* CLOSE MOBILE MENU */

        mobileMenu
            .querySelectorAll("a")
            .forEach(
                link => {

                    link.addEventListener(
                        "click",
                        function () {

                            mobileMenu.classList.remove(
                                "open"
                            );

                            openMenu.classList.remove(
                                "active"
                            );

                            openMenu.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }
                    );

                }
            );


        /* =====================================================
           SEARCH
        ====================================================== */

        const openSearch =
            document.getElementById("openSearch");

        const searchPanel =
            document.getElementById("searchPanel");

        const closeSearch =
            document.getElementById("closeSearch");

        const siteSearch =
            document.getElementById("siteSearch");


        openSearch.addEventListener(
            "click",
            function () {

                searchPanel.classList.add(
                    "open"
                );

                searchPanel.setAttribute(
                    "aria-hidden",
                    "false"
                );

                setTimeout(
                    () => siteSearch.focus(),
                    200
                );

            }
        );


        closeSearch.addEventListener(
            "click",
            function () {

                searchPanel.classList.remove(
                    "open"
                );

                searchPanel.setAttribute(
                    "aria-hidden",
                    "true"
                );

            }
        );


        /* =====================================================
           ESCAPE KEY
        ====================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    searchPanel.classList.remove(
                        "open"
                    );

                    searchPanel.setAttribute(
                        "aria-hidden",
                        "true"
                    );

                    mobileMenu.classList.remove(
                        "open"
                    );

                    openMenu.classList.remove(
                        "active"
                    );

                    openMenu.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }

            }
        );

    </script>

</body>

</html>
